
name: RAG Pipeline - Test and Sync

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rag-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # -------------------------------------------------------
  # JOB 1: Automated Testing
  # -------------------------------------------------------

  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      knowledge_changed: ${{ steps.detect.outputs.knowledge_changed }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: rag-backend/requirements-dev.txt

      - name: Install development dependencies
        working-directory: rag-backend
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        working-directory: rag-backend
        run: |
          python -m pytest tests/ -v

      - name: Detect knowledge changes
        id: detect
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual run: synchronization enabled."
            echo "knowledge_changed=true" >> "$GITHUB_OUTPUT"

          elif [[ "$EVENT_NAME" != "push" ]]; then
            echo "Pull request: synchronization waits until merge."
            echo "knowledge_changed=false" >> "$GITHUB_OUTPUT"

          elif [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "Initial push: synchronization enabled."
            echo "knowledge_changed=true" >> "$GITHUB_OUTPUT"

          else
            CHANGED_FILES=$(git diff --name-only \
              "$BEFORE" "$GITHUB_SHA" -- README.md knowledge/)

            if [[ -n "$CHANGED_FILES" ]]; then
              echo "Portfolio knowledge changes detected."
              echo "$CHANGED_FILES"
              echo "knowledge_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "No portfolio knowledge changes detected."
              echo "knowledge_changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi


  # -------------------------------------------------------
  # JOB 2: Synchronize Knowledge with Qdrant Cloud
  # -------------------------------------------------------

  sync_knowledge:
    name: Synchronize Portfolio Knowledge
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - test

    if: needs.test.outputs.knowledge_changed == 'true'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: rag-backend/requirements.txt

      - name: Install backend dependencies
        working-directory: rag-backend
        run: |
          python -m pip install -r requirements.txt

      - name: Synchronize documents with Qdrant Cloud
        working-directory: rag-backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          python -m app.vector_store --sync
